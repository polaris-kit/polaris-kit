name: Chromatic

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromatic:
    name: Publish Storybook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      - name: Publish to Chromatic
        id: chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: apps/storybook
          buildScriptName: build
          exitZeroOnChanges: true
          onlyChanged: true

      - name: Storybook URL
        if: steps.chromatic.outputs.storybookUrl != ''
        run: |
          echo "### Storybook published" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open documentation](${{ steps.chromatic.outputs.storybookUrl }})" >> "$GITHUB_STEP_SUMMARY"
          echo "Storybook URL: ${{ steps.chromatic.outputs.storybookUrl }}"
